name: Run OmniRoute Service

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: run-group
  cancel-in-progress: true

env:
  UPLOAD_API_TOKEN: ${{ secrets.UPLOAD_API_TOKEN }}
  WANGTAO318_TOKEN: ${{ secrets.WANGTAO318_TOKEN }}
  PRIVATE_REPO_TOKEN: ${{ secrets.PRIVATE_REPO_TOKEN }}
  GH_OWNER: ${{ github.repository_owner }}
  GH_REPO: ${{ github.event.repository.name }}
  RUN_DURATION: 19800
  DB_REPO_URL: https://x-access-token:${{ secrets.WANGTAO318_TOKEN }}@github.com/wangtao318/db-storage.git

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-node@v4
        with:
          # tarball better-sqlite3 prebuilds target LTS; Node 26 blocks install scripts
          node-version: 22

      - name: Download latest OmniRoute build
        run: |
          echo "Fetching latest release from jjjjllll111/omniroute-private..."
          RELEASE_INFO=$(curl -sH "Authorization: token ${{ secrets.PRIVATE_REPO_TOKEN }}" \
            "https://api.github.com/repos/jjjjllll111/omniroute-private/releases/tags/hf-latest")

          DOWNLOAD_URL=$(echo "$RELEASE_INFO" | jq -r '.assets[] | select(.name=="omniroute-dist.tar.gz") | .url')

          if [ -z "$DOWNLOAD_URL" ]; then
            echo "Error: Could not find omniroute-dist.tar.gz in hf-latest release"
            exit 1
          fi

          echo "Downloading from: $DOWNLOAD_URL"
          curl -L -H "Authorization: token ${{ secrets.PRIVATE_REPO_TOKEN }}" \
            -H "Accept: application/octet-stream" \
            "$DOWNLOAD_URL" -o omniroute-dist.tar.gz

          echo "Extracting..."
          mkdir -p app
          tar -xzf omniroute-dist.tar.gz -C app
          ls -lah app/
          echo "Download complete!"

      - name: Restore DB from private git repo
        run: |
          git clone https://x-access-token:${{ secrets.WANGTAO318_TOKEN }}@github.com/wangtao318/db-storage.git db-repo || mkdir db-repo
          mkdir -p app/data
          if [ -f db-repo/data.zip ]; then
            unzip -o db-repo/data.zip -d app/
            rm -rf app/data/logs app/data/bin
            echo "DB and data restored from zip."
          else
            echo "Fresh start - no previous DB found"
          fi

      - name: Install sqlite-vec native module
        run: |
          cd app
          echo "Rebuilding native modules for Node $(node -v)..."
          # Node 26 blocks install scripts by default — approve first (see cc6bfe8)
          npm install sqlite-vec better-sqlite3 --save-optional --no-package-lock --legacy-peer-deps || true
          npm approve-scripts --allow-scripts-pending || true
          npm rebuild better-sqlite3 2>&1 || true
          npm rebuild sqlite-vec 2>&1 || true
          # smoke-load natives so we fail early with a clear error
          node -e "require('better-sqlite3'); console.log('better-sqlite3 OK')" 2>&1 || echo "⚠ better-sqlite3 load failed"
          node -e "try{require('sqlite-vec');console.log('sqlite-vec OK')}catch(e){console.log('sqlite-vec:',e.message)}" 2>&1 || true
          echo "native module step done"

      - name: Start service
        id: start
        run: |
          cd app
          export APP_DIR="$PWD" DATA_DIR="$PWD/data" PORT=20128 HOSTNAME=0.0.0.0 NODE_ENV=production
          export JWT_SECRET="${{ secrets.JWT_SECRET }}"
          export API_KEY_SECRET="${{ secrets.API_KEY_SECRET }}"
          export INITIAL_PASSWORD="${{ secrets.INITIAL_PASSWORD }}"
          export OMNIROUTE_ENABLE_RUNTIME_BACKGROUND_TASKS=true
          export ENABLE_TLS_FINGERPRINT=true
          export OMNIROUTE_PUBLIC_BASE_URL="${{ secrets.OMNIROUTE_PUBLIC_BASE_URL }}"

          # Check if standalone build exists
          if [ -d ".next/standalone" ]; then
            cd .next/standalone
            nohup node server.js > /tmp/app.log 2>&1 &
          elif [ -f "server.js" ]; then
            nohup node server.js > /tmp/app.log 2>&1 &
          else
            echo "Error: Could not find server.js"
            exit 1
          fi

          APP_PID=$!
          echo "pid=$APP_PID" >> $GITHUB_OUTPUT

          sleep 5
          READY=0
          for i in $(seq 1 15); do
            CODE=$(curl -sk -o /dev/null -w '%{http_code}' http://localhost:20128/ --max-time 5 2>/dev/null || echo 000)
            echo "boot probe $i: HTTP $CODE"
            # any HTTP response means process is up (even 500 — dump log for that)
            if [ "$CODE" != "000" ] && [ -n "$CODE" ]; then
              READY=1
              break
            fi
            sleep 2
          done
          echo "=== /tmp/app.log (first boot) ==="
          cat /tmp/app.log || true
          echo "================================"
          if [ "$READY" = "1" ] && [ "$CODE" -ge 200 ] 2>/dev/null && [ "$CODE" -lt 500 ] 2>/dev/null; then
            echo "Service ready at http://localhost:20128 (HTTP $CODE)"
          else
            echo "⚠ Service responded with HTTP ${CODE:-none} — see app.log above"
          fi

      - name: Setup Cloudflare Tunnel
        id: cloudflare
        run: |
          curl -fsSL https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64 -o /usr/local/bin/cloudflared
          chmod +x /usr/local/bin/cloudflared
          nohup cloudflared tunnel --no-autoupdate run --token ${{ secrets.CF_TUNNEL_TOKEN }} > /dev/null 2>&1 &
          echo "$!" > /tmp/cloudflared.pid
          sleep 5
          echo "Cloudflare tunnel started"

      - name: Start SSH server
        run: |
          # Install openssh-server
          sudo apt-get update -qq
          sudo apt-get install -y -qq openssh-server

          # Generate host keys
          sudo ssh-keygen -A

          # Configure sshd for password login and key-based auth
          sudo sed -i 's/^#\?PermitRootLogin.*/PermitRootLogin yes/' /etc/ssh/sshd_config
          sudo sed -i 's/^#\?PasswordAuthentication.*/PasswordAuthentication yes/' /etc/ssh/sshd_config
          sudo sed -i 's/^#\?PubkeyAuthentication.*/PubkeyAuthentication yes/' /etc/ssh/sshd_config
          sudo sed -i 's/^#\?AuthorizedKeysFile.*/AuthorizedKeysFile .ssh\/authorized_keys/' /etc/ssh/sshd_config
          sudo sed -i 's/^#\?ChallengeResponseAuthentication.*/ChallengeResponseAuthentication no/' /etc/ssh/sshd_config
          sudo sed -i 's/^#\?UsePAM.*/UsePAM yes/' /etc/ssh/sshd_config

          # Use fixed password from GitHub Secrets (no longer random)
          SSH_PASS="${{ secrets.SSH_PASSWORD }}"
          echo "runner:$SSH_PASS" | sudo chpasswd

          # Also set for root for debugging
          echo "root:$SSH_PASS" | sudo chpasswd

          # Start sshd
          sudo service ssh start

          # Verify
          sudo ss -tlnp | grep :22 && echo "✓ sshd running" || echo "⚠ sshd may not have started"

          # Install fixed SSH public key from GitHub Secret (same key every run)
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          echo "${{ secrets.SSH_PUBLIC_KEY }}" >> ~/.ssh/authorized_keys
          chmod 600 ~/.ssh/authorized_keys
          chown -R runner:runner ~/.ssh 2>/dev/null || true

          # Also for root
          sudo mkdir -p /root/.ssh
          sudo chmod 700 /root/.ssh
          echo "${{ secrets.SSH_PUBLIC_KEY }}" | sudo tee -a /root/.ssh/authorized_keys > /dev/null
          sudo chmod 600 /root/.ssh/authorized_keys

          # Echo password to logs
          echo "=========================================="
          echo "SSH Password: $SSH_PASS"
          echo "SSH connects via fixed keypair (no password needed)"
          echo "=========================================="

          # Save credentials to db-storage (wangtao318/db-storage)
          if [ ! -d db-repo ]; then
            git clone https://x-access-token:${{ secrets.WANGTAO318_TOKEN }}@github.com/wangtao318/db-storage.git db-repo 2>/dev/null || mkdir db-repo
          fi
          (cd db-repo
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git remote set-url origin https://x-access-token:${{ secrets.WANGTAO318_TOKEN }}@github.com/wangtao318/db-storage.git 2>/dev/null || true
            
            echo "SSH Credentials ($(date -u +%Y-%m-%dT%H:%M:%SZ))" > ssh-credentials.txt
            echo "==========================================" >> ssh-credentials.txt
            echo "Host: ssh.logincore.me" >> ssh-credentials.txt
            echo "User: runner (or root)" >> ssh-credentials.txt
            echo "Password: $SSH_PASS" >> ssh-credentials.txt
            echo "==========================================" >> ssh-credentials.txt
            echo "Connect:" >> ssh-credentials.txt
            echo "  1. cloudflared access login --app ssh.logincore.me" >> ssh-credentials.txt
            echo "  2. ssh runner@ssh.logincore.me" >> ssh-credentials.txt
            echo "Or use ~/.ssh/config:" >> ssh-credentials.txt
            echo "  Host ssh.logincore.me" >> ssh-credentials.txt
            echo "    ProxyCommand cloudflared access ssh --hostname %h" >> ssh-credentials.txt
            echo "    User runner" >> ssh-credentials.txt
            
            git checkout --orphan temp-branch 2>/dev/null || git checkout -b temp-branch
            git add ssh-credentials.txt
            git commit -m "SSH credentials $(date -u +%Y-%m-%dT%H:%M:%SZ)" --allow-empty
            git branch -M main
            git push -f origin main 2>&1 || echo "⚠ Failed to push SSH credentials"
          )
          echo "✓ SSH credentials saved to db-storage/ssh-credentials.txt"

      - name: Display access info
        run: |
          echo "=========================================="
          echo "Service is running!"
          echo "=========================================="
          echo ""
          echo "Local port: 20128"
          echo "Public URL: https://app.logincore.me"
          echo "SSH: see db-storage/ssh-credentials.txt"
          echo ""
          echo "=========================================="

      - name: Verify connectivity
        continue-on-error: true
        run: |
          for i in 1 2 3; do
            CODE=$(curl -sk -o /dev/null -w '%{http_code}' "http://localhost:20128/" --max-time 10 2>/dev/null)
            echo "Health check $i: HTTP $CODE"
            if [ "$CODE" -ge 200 ] && [ "$CODE" -lt 500 ] 2>/dev/null; then
              echo "✓ Service is accessible"
              exit 0
            fi
            sleep 5
          done
          echo "=== /tmp/app.log after failed health checks ==="
          cat /tmp/app.log || true
          echo "================================================"

      - name: Keep alive + watchdog
        run: |
          upload_db() {
            echo "[$(date)] Uploading DB backup to wangtao318/db-storage..."
            mkdir -p db-repo
            (cd app && zip -r ../db-repo/data.zip data/ -x "data/logs/*" "data/bin/*")
            (cd db-repo
              git config user.name "github-actions[bot]"
              git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
              [ ! -d .git ] && git init && git remote add origin https://x-access-token:${{ secrets.WANGTAO318_TOKEN }}@github.com/wangtao318/db-storage.git
              git remote set-url origin https://x-access-token:${{ secrets.WANGTAO318_TOKEN }}@github.com/wangtao318/db-storage.git 2>/dev/null || true
              # Preserve ssh-credentials.txt before cleanup
              [ -f ssh-credentials.txt ] && cp ssh-credentials.txt /tmp/ssh-creds.backup
              git checkout --orphan temp-branch 2>/dev/null || git checkout -b temp-branch
              git add data.zip
              # Restore ssh-credentials.txt after DB copy
              [ -f /tmp/ssh-creds.backup ] && cp /tmp/ssh-creds.backup ssh-credentials.txt && git add ssh-credentials.txt
              git commit -m "backup $(date -u +%Y-%m-%dT%H:%M:%SZ)" --allow-empty
              git branch -M main
              git push -f origin main 2>&1 || echo "[$(date)] ⚠ git push failed, continuing..."
            )
            echo "[$(date)] DB backup complete"
          }

          END=$((SECONDS + ${{ env.RUN_DURATION }}))
          LAST_UPLOAD=0

          while [ $SECONDS -lt $END ]; do
            NOW=$(date +%s)

            # Check Cloudflare tunnel health
            CF_PID=$(cat /tmp/cloudflared.pid 2>/dev/null || echo 0)
            if [ "$CF_PID" -gt 0 ] && ! kill -0 $CF_PID 2>/dev/null; then
              echo "[$(date)] ⚠ Cloudflared died, restarting..."
              nohup cloudflared tunnel --no-autoupdate run --token ${{ secrets.CF_TUNNEL_TOKEN }} > /dev/null 2>&1 &
              echo "$!" > /tmp/cloudflared.pid
              sleep 3
            fi

            # Check service health
            if ! kill -0 ${{ steps.start.outputs.pid }} 2>/dev/null; then
              echo "[$(date)] ⚠ Service died, restarting..."
              echo "=== Last 30 lines of /tmp/app.log ==="
              tail -n 30 /tmp/app.log || true
              echo "====================================="
              cd app
              export APP_DIR="$PWD" DATA_DIR="$PWD/data" PORT=20128 HOSTNAME=0.0.0.0 NODE_ENV=production
              export JWT_SECRET="${{ secrets.JWT_SECRET }}"
              export API_KEY_SECRET="${{ secrets.API_KEY_SECRET }}"
              export INITIAL_PASSWORD="${{ secrets.INITIAL_PASSWORD }}"
              export OMNIROUTE_ENABLE_RUNTIME_BACKGROUND_TASKS=true
              export ENABLE_TLS_FINGERPRINT=true
              export OMNIROUTE_PUBLIC_BASE_URL="${{ secrets.OMNIROUTE_PUBLIC_BASE_URL }}"
              
              if [ -d ".next/standalone" ]; then
                cd .next/standalone
              fi
              nohup node server.js > /tmp/app.log 2>&1 &
              echo "pid=$!" >> $GITHUB_OUTPUT
              cd $GITHUB_WORKSPACE
              sleep 5
            fi

            # Upload DB every 10 minutes
            if [ $((NOW - LAST_UPLOAD)) -ge 600 ]; then
              upload_db
              LAST_UPLOAD=$NOW
            fi

            REMAINING=$((END - SECONDS))
            echo "[$(date)] ⏱ Remaining: $((REMAINING/3600))h $(((REMAINING%3600)/60))m"
            sleep 30
          done

      - name: Final DB backup
        if: always()
        run: |
          echo "Stopping service..."
          kill ${{ steps.start.outputs.pid }} 2>/dev/null || true
          sleep 3

          echo "Final DB backup to wangtao318/db-storage..."
          mkdir -p db-repo
          (cd app && zip -r ../db-repo/data.zip data/ -x "data/logs/*" "data/bin/*")
          (cd db-repo
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            [ ! -d .git ] && git init && git remote add origin https://x-access-token:${{ secrets.WANGTAO318_TOKEN }}@github.com/wangtao318/db-storage.git
            git remote set-url origin https://x-access-token:${{ secrets.WANGTAO318_TOKEN }}@github.com/wangtao318/db-storage.git 2>/dev/null || true
            # Preserve ssh-credentials.txt before cleanup
            [ -f ssh-credentials.txt ] && cp ssh-credentials.txt /tmp/ssh-creds-final.backup
            git checkout --orphan temp-branch 2>/dev/null || git checkout -b temp-branch
            git add data.zip
            # Restore ssh-credentials.txt after DB copy
            [ -f /tmp/ssh-creds-final.backup ] && cp /tmp/ssh-creds-final.backup ssh-credentials.txt && git add ssh-credentials.txt
            git commit -m "final backup $(date -u +%Y-%m-%dT%H:%M:%SZ)" --allow-empty
            git branch -M main
            git push -f origin main 2>&1 || echo "[$(date)] ⚠ git push failed, continuing..."
          )
          echo "=== Done ==="
